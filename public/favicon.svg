<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="StellaXafe">
  <!-- The Containment Seal, frozen for a tab. Full spec in MARK.md.

       This file cannot read the app's theme variables, and a tab strip is
       light in some browsers and dark in others, so the colours here are
       picked to hold on either. The inner gradient stops at purple rather
       than running to near white, which is right inside the app on a dark
       ground and invisible on a white tab strip. -->
  <defs>
    <linearGradient id="seal-inner" x1="18" y1="82" x2="82" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2030C8"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- The company boundary -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#7C819B" stroke-width="3"/>

  <!-- The model gateway -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#seal-inner)" stroke-width="7"/>

  <!-- The data, held at one o'clock in the channel.

       The channel is the gap between the two stroke faces, not between the
       two radii. Boundary stroke 3 puts its inner face at 42.5, gateway
       stroke 7 puts its outer face at 33.5, so the bead is radius 4.5 at a
       travel radius of 38, which at one o'clock is 38 over root two on
       each axis. -->
  <circle cx="76.87" cy="23.13" r="4.5" fill="#F5A820"/>
</svg>
